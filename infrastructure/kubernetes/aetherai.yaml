# AetherAI Kubernetes manifests (spec Section 42).
#
# HONEST SCOPE NOTE: written to be correct and internally consistent, but
# NOT verified against a live cluster in the environment this project was
# built in (no Kubernetes control plane available there). Validate with
# `kubectl apply --dry-run=client -f infrastructure/kubernetes/` and test
# against Minikube before relying on this for a real deployment.
apiVersion: v1
kind: Namespace
metadata:
  name: aetherai

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aetherai-config
  namespace: aetherai
data:
  ENV: "prod"
  MODEL_ARTIFACT_DIR: "/app/model_artifacts"

---
apiVersion: v1
kind: Secret
metadata:
  name: aetherai-secrets
  namespace: aetherai
type: Opaque
stringData:
  # Replace with real values via `kubectl create secret` or a secrets
  # manager (Vault/AWS Secrets Manager/Azure Key Vault) in production --
  # never commit real secrets here.
  DATABASE_URL: "postgresql+psycopg2://postgres:CHANGE_ME@postgres:5432/aetherai"
  JWT_SECRET: "CHANGE_ME"
  GITHUB_TOKEN: ""

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: aetherai
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: postgres}
            - {name: POSTGRES_PASSWORD, value: aetherpass}
            - {name: POSTGRES_DB, value: aetherai}
          volumeMounts:
            - {name: pgdata, mountPath: /var/lib/postgresql/data}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "postgres"]}
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata: {name: pgdata}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 5Gi}}

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: aetherai
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: aetherai
spec:
  replicas: 2
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      containers:
        - name: backend
          image: aetherai/backend:latest
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: aetherai-config}
            - secretRef: {name: aetherai-secrets}
          readinessProbe:
            httpGet: {path: /api/v1/monitoring/health, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/v1/monitoring/health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "1", memory: "1Gi"}

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: aetherai
spec:
  selector: {app: backend}
  ports: [{port: 8000, targetPort: 8000}]

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: aetherai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: aetherai
spec:
  replicas: 2
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: aetherai/frontend:latest
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: aetherai
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80}]

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aetherai-ingress
  namespace: aetherai
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: aetherai.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: backend, port: {number: 8000}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: frontend, port: {number: 80}}}
